version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../infra/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql+asyncpg://swarmscope:swarmscope@postgres:5432/swarmscope
      - REDIS_URL=redis://redis:6379/0
    networks:
      - swarmnet

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/Dockerfile.frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - swarmnet

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: swarmscope
      POSTGRES_USER: swarmscope
      POSTGRES_PASSWORD: swarmscope
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarmscope -d swarmscope"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - swarmnet

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - swarmnet

volumes:
  pgdata:
  uploads:

networks:
  swarmnet:
    driver: bridge
