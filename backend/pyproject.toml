[project]
name = "swarmscope"
version = "0.1.0"
description = "SwarmScope — Scenario Simulation Lab"
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "google-genai>=1.0.0",
    "redis>=5.2.0",
    "python-multipart>=0.0.12",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.1,<5.0.0",
    "numpy>=2.1.0",
    "httpx>=0.28.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "google.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.gemini.decisions"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.gemini.client"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
